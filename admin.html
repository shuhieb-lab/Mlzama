<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة إدارة ملزمة</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{background:#f5f8f8}.admin-shell{padding:28px 0 70px}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.admin-top img{width:140px;height:60px;object-fit:contain;background:#fff;border-radius:12px}.admin-title h1{margin:0}.admin-title p{margin:2px 0 0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.stat span{color:var(--muted)}.stat strong{display:block;font-size:2rem;margin-top:4px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap}.toolbar input{min-width:280px;border:1px solid var(--line);border-radius:13px;padding:12px 14px}.orders{display:grid;gap:14px}.order{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px}.order-id{font-weight:900;color:var(--brand-dark)}.status{font-size:.85rem;padding:7px 11px;border-radius:999px;font-weight:900}.status-new{background:#e6f7ff;color:#006b8f}.status-printing{background:#fff7d6;color:#8a6500}.status-ready{background:#e8fbf2;color:#08774d}.status-completed{background:#eef1f3;color:#56646d}.order-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.order-grid div{background:#f8fbfb;border-radius:13px;padding:11px}.order-grid span{display:block;color:var(--muted);font-size:.82rem}.order-grid strong{font-size:.95rem}.file-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;background:#eff8f5;border:1px solid #dceee9;border-radius:999px;font-size:.84rem}.order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.order-actions select{border:1px solid var(--line);border-radius:12px;padding:10px}.empty{background:#fff;border:1px dashed #cad9d6;border-radius:22px;padding:60px 20px;text-align:center;color:var(--muted)}
    @media(max-width:820px){.stats,.order-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.stats,.order-grid{grid-template-columns:1fr}.toolbar input{min-width:100%;width:100%}.admin-top{align-items:flex-start}.admin-top .btn{display:none}}
  </style>
</head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img src="logo.jpeg" alt="ملزمة"></a><a class="btn btn-ghost btn-small" href="index.html">واجهة العميل</a></div></header>
<main class="admin-shell"><div class="container">
  <div class="admin-top"><div class="admin-title"><h1>لوحة إدارة الطلبات</h1><p>نسخة تجريبية محفوظة على نفس المتصفح.</p></div><button id="clearAll" class="btn btn-ghost">مسح الطلبات التجريبية</button></div>
  <section class="stats"><div class="stat"><span>طلبات جديدة</span><strong id="statNew">٠</strong></div><div class="stat"><span>جاري الطباعة</span><strong id="statPrinting">٠</strong></div><div class="stat"><span>جاهزة</span><strong id="statReady">٠</strong></div><div class="stat"><span>مكتملة</span><strong id="statCompleted">٠</strong></div></section>
  <div class="toolbar"><input id="search" placeholder="ابحث برقم الطلب أو اسم العميل أو الجوال"><span id="countLabel"></span></div>
  <section id="orders" class="orders"></section>
</div></main>
<script src="admin.js"></script>
</body>
</html>
