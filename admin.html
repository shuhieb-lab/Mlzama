<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة ملزمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#102a2d;--muted:#748486;--green:#0aa87f;--dark:#0d3033;--line:#e3ebe8;--bg:#f3f6f5;--red:#c84242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",sans-serif}.shell{width:min(920px,calc(100% - 24px));margin:auto;padding:18px 0 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;object-fit:cover;border-radius:13px}.brand strong,.brand span{display:block}.brand span{color:var(--muted);font-size:.72rem}.card{padding:20px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px rgba(24,50,52,.06)}h1,h2{margin:0}.lead{margin:5px 0 20px;color:var(--muted)}.auth{width:min(450px,100%);margin:12vh auto}.field{display:grid;gap:6px}.field span{font-size:.78rem;font-weight:800}.field input,.field select{width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;outline:none}.btn{min-height:48px;padding:0 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,#12b98c,#08745f)}.ghost{color:var(--ink);background:#edf3f1}.danger{color:var(--red);background:#fff0f0}.auth .btn{width:100%;margin-top:12px}.status{margin:10px 0 0;color:var(--muted);font-size:.8rem}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.section-title p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.price-grid .field input{text-align:center}.actions{display:flex;gap:9px;margin-top:16px}.discount-form{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:9px}.discounts,.orders{display:grid;gap:10px;margin-top:14px}.discount{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px}.discount div{display:grid}.discount small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{padding:13px;background:#f3f8f6;border-radius:14px}.stat span{display:block;color:var(--muted);font-size:.7rem}.stat strong{font-size:1.35rem}.order{padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff}.order-head{display:flex;justify-content:space-between;gap:12px}.order-number{color:var(--green);font-weight:900}.order-head small{display:block;color:var(--muted)}.order-total{font-size:1.25rem;font-weight:900}.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.order-grid div{padding:9px;background:#f6f9f8;border-radius:10px}.order-grid span{display:block;color:var(--muted);font-size:.68rem}.order-grid strong{font-size:.8rem}.files{display:flex;gap:7px;flex-wrap:wrap}.file-link{padding:7px 10px;color:#08745f;background:#e9f8f3;border-radius:9px;text-decoration:none;font-size:.75rem;font-weight:800}.order-actions{display:flex;align-items:center;gap:8px;margin-top:12px}.order-actions select{height:42px;padding:0 9px;border:1px solid var(--line);border-radius:10px}.whatsapp{margin-right:auto;color:#fff;background:#18a86f;text-decoration:none;display:grid;place-items:center;min-height:42px}.empty{padding:25px;text-align:center;color:var(--muted);background:#f7faf9;border-radius:14px}[hidden]{display:none!important}@media(max-width:700px){.price-grid,.discount-form{grid-template-columns:1fr 1fr}.card{padding:16px;border-radius:20px}.order-grid{grid-template-columns:1fr 1fr}}@media(max-width:420px){.price-grid,.discount-form{grid-template-columns:1fr}.top{align-items:flex-start}.stats{grid-template-columns:1fr 1fr}.order-head{display:grid}.order-actions{flex-wrap:wrap}.whatsapp{margin-right:0;width:100%}}
</style></head><body><main class="shell">
<header class="top"><div class="brand"><img src="logo.jpeg" alt="ملزمة"><div><strong>لوحة إدارة ملزمة</strong><span>الأسعار والعروض</span></div></div><a href="index.html" class="btn ghost" style="text-decoration:none;display:grid;place-items:center">واجهة العميل</a></header>
<section id="loginCard" class="card auth"><h1>دخول الإدارة</h1><p class="lead">أدخل البريد المعتمد وسنرسل لك رابط دخول آمن.</p><label class="field"><span>البريد الإلكتروني</span><input id="adminEmail" type="email" autocomplete="email" placeholder="name@example.com"></label><button id="sendLink" class="btn primary">إرسال رابط الدخول</button><p id="loginStatus" class="status"></p></section>
<div id="adminPanel" hidden>
  <section class="card"><div class="section-title"><div><h2>الطلبات</h2><p>الطلبات الجديدة تظهر هنا تلقائيًا.</p></div><button id="refreshOrders" class="btn ghost">تحديث</button></div>
    <div class="stats"><div class="stat"><span>إجمالي الطلبات</span><strong id="allOrders">٠</strong></div><div class="stat"><span>طلبات جديدة</span><strong id="newOrders">٠</strong></div><div class="stat"><span>قيد الطباعة</span><strong id="printingOrders">٠</strong></div></div>
    <div id="orders" class="orders"></div>
  </section>
  <section class="card" style="margin-top:14px"><div class="section-title"><div><h2>أسعار الطباعة والتوصيل</h2><p>تظهر للعميل مباشرة بعد الحفظ.</p></div></div><div class="price-grid">
    <label class="field"><span>أسود A4</span><input data-price="bw_a4" type="number" min="0" step="0.01"></label><label class="field"><span>أسود A3</span><input data-price="bw_a3" type="number" min="0" step="0.01"></label><label class="field"><span>ملون A4</span><input data-price="color_a4" type="number" min="0" step="0.01"></label><label class="field"><span>ملون A3</span><input data-price="color_a3" type="number" min="0" step="0.01"></label>
    <label class="field"><span>تجليد سلك</span><input data-price="binding_spiral" type="number" min="0" step="0.01"></label><label class="field"><span>تدبيس ولزق</span><input data-price="binding_staple" type="number" min="0" step="0.01"></label><label class="field"><span>تغليف حراري</span><input data-price="binding_lamination" type="number" min="0" step="0.01"></label><label class="field"><span>سعر التوصيل</span><input data-price="delivery_fee" type="number" min="0" step="0.01"></label>
  </div><div class="actions"><button id="savePricing" class="btn primary">حفظ الأسعار</button><span id="pricingStatus" class="status"></span></div></section>
  <section class="card" style="margin-top:14px"><div class="section-title"><h2>أكواد الخصم</h2><p>أنشئ كودًا بنسبة أو مبلغ ثابت.</p></div><div class="discount-form">
    <label class="field"><span>الكود</span><input id="code" maxlength="30" placeholder="MLZAMA10"></label><label class="field"><span>نوع الخصم</span><select id="discountType"><option value="percent">نسبة مئوية</option><option value="fixed">مبلغ ثابت</option></select></label><label class="field"><span>القيمة</span><input id="discountValue" type="number" min="0.01" step="0.01"></label><label class="field"><span>الحد الأدنى</span><input id="minimumOrder" type="number" min="0" step="0.01" value="0"></label>
    <label class="field"><span>تاريخ الانتهاء</span><input id="expiresAt" type="date"></label><label class="field"><span>عدد الاستخدامات</span><input id="usageLimit" type="number" min="1" placeholder="غير محدود"></label>
  </div><div class="actions"><button id="saveDiscount" class="btn primary">حفظ كود الخصم</button><span id="discountStatus" class="status"></span></div><div id="discounts" class="discounts"></div></section>
  <button id="logout" class="btn ghost" style="margin-top:14px">تسجيل الخروج</button>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-v4.js"></script></body></html>
